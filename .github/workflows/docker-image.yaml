name: Build or publish a reviewed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (vX.Y.Z); publish only after integration review'
        required: true
        type: string
      publish:
        description: 'Publish this reviewed image to Docker Hub'
        required: true
        default: false
        type: boolean
      parent_image:
        description: 'Published parent digest recorded in release-parent.json'
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build exact source with explicit fixed parent
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          PARENT_IMAGE: ${{ inputs.parent_image }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IMAGE="$REPOSITORY:${VERSION#v}"
          python - <<'PYTHON'
          import json, os, re
          with open('release-parent.json', encoding='utf-8') as stream:
              lock = json.load(stream)
          parent = os.environ['PARENT_IMAGE']
          expected_repository = 'zaandahl/mewc-flow'
          if (lock.get('repository') != expected_repository
                  or not re.fullmatch(re.escape(expected_repository) + r'@sha256:[a-f0-9]{64}', parent)
                  or lock.get('image') != parent
                  or not re.fullmatch(r'[a-f0-9]{40}', lock.get('source_commit', ''))):
              raise SystemExit('Parent must match the reviewed release-parent.json; record its verified published digest first')
          PYTHON
          docker build --build-arg MEWC_FLOW_BASE="$PARENT_IMAGE" --tag "$IMAGE" .
          docker image inspect "$IMAGE" --format '{{.Id}}'
      - name: Publish after explicit dispatch choice
        if: ${{ inputs.publish }}
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
          docker push "$REPOSITORY:${VERSION#v}"
