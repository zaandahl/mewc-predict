name: Integrity contracts
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: mewc-predict
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zaandahl/mewc-flow
          ref: a7d22acabcacb306edf62c723a7bcfb31a843874
          path: mewc-flow
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked lightweight test dependencies
        working-directory: mewc-predict
        run: python -m pip install --require-hashes -r requirements-test.txt
      - name: Run integrity tests
        working-directory: mewc-predict
        run: |
          python -m pytest -q
          python -m compileall -q src
          git diff --check
